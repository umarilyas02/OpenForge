name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "11.17.0"

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Test
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action fails the job (non-zero exit) when it finds a
          # real leak; this is not merely advisory. GITLEAKS_LICENSE is
          # only required for private-repo use under an organization
          # account — not needed while this repository is public.

  dependency-audit:
    name: Dependency vulnerability and license scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # --prod: only dependencies that actually ship at runtime (not
      # eslint/vitest/etc., which pose no production risk). --audit-level
      # high: fails the build on high/critical findings, not every
      # moderate/low advisory in a transitive devtool -- this caught two
      # real, unauthenticated-RCE-class Next.js CVEs (GHSA-p293-qw3h-jr36,
      # GHSA-2xp9-vwfh-vxw4) during the 2026-09-17 hardening pass; see
      # agents/progress.md.
      - name: Audit production dependencies
        run: corepack pnpm audit --prod --audit-level high

      # Fails on any production dependency whose license isn't in the
      # explicit allowlist in tooling/scripts/check-licenses.js (permissive
      # licenses only, no copyleft that would force this Apache-2.0
      # project's own source to be relicensed).
      - name: Check dependency licenses
        run: corepack pnpm --filter @openforge/scripts run check:licenses
