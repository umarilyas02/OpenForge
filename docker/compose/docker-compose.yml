name: openforge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ../../envs/local/infrastructure.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openforge}
      POSTGRES_USER: ${POSTGRES_USER:-openforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openforge_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ../volumes/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-openforge} -d ${POSTGRES_DB:-openforge}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - path: ../../envs/local/infrastructure.env
        required: false
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ../volumes/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - path: ../../envs/local/infrastructure.env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openforge_dev_only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ../volumes/minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
